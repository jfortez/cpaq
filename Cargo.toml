[package]
name = "cpaq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLIProxyAPI quotas and tokenmaxx management"
readme = "README.md"
license = "MIT"
repository = "https://github.com/jfortez/cpaq"
homepage = "https://github.com/jfortez/cpaq"
keywords = ["cli", "tui", "quota", "cli-proxy", "tokenmaxx"]
categories = [
    "command-line-interface",
    "command-line-utilities",
    "development-tools",
    "network-programming",
]
exclude = ["odd/*", ".github/*", "tests/*"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
# Local civil time and ISO reset timestamps without shelling out.
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
