name: release

on:
  workflow_dispatch:

# A release writes to main, pushes a tag and publishes to crates.io. Two runs
# must never interleave, so a queued run waits instead of being cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: bump, tag, publish
    runs-on: ubuntu-latest
    steps:
      - name: Require the crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add a crates.io API token under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and an up-to-date checkout
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Run this workflow from main, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::HEAD is not origin/main. Re-run the workflow from the current main."
            exit 1
          fi

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Bump the patch version
        id: bump
        run: |
          version="$(scripts/release.sh | tail -n 1)"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "Releasing v${version}"

      - name: Commit, tag and push the bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:main"
          git push origin "v${VERSION}"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
